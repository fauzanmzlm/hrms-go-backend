services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hrms
      MYSQL_USER: hrms
      MYSQL_PASSWORD: hrms
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uhrms", "-phrms"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_PORT: "8080"
      DB_DSN: "hrms:hrms@tcp(mysql:3306)/hrms"
      AUTO_MIGRATE: "true"
      JWT_SECRET: "${JWT_SECRET:-dev-only-secret-change-me-0123456789}"
      BOOTSTRAP_ADMIN_USERNAME: "admin"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe-2026}"
    ports:
      - "8080:8080"
    stop_grace_period: 20s

volumes:
  mysql-data:
